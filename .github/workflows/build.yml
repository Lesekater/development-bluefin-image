---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image (${{ matrix.variant.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: "bluefin"
            base_image: "ghcr.io/ublue-os/bluefin-dx-nvidia-open:latest"
            image_desc: "Developer-focused Universal Blue image with NVIDIA support"
          - name: "bluefin-laptop"
            base_image: "ghcr.io/ublue-os/bluefin-dx:latest"
            image_desc: "Developer-focused Universal Blue image for laptops"
          - name: "bazzite"
            base_image: "ghcr.io/ublue-os/bazzite-nvidia:latest"
            image_desc: "Gaming-optimized Universal Blue image with NVIDIA support"

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      # Consumed by the Justfile (see the `export ... := env(...)` lines at its top)
      IMAGE_NAME: ${{ github.event.repository.name }}-${{ matrix.variant.name }}
      REPO_NAME: ${{ github.event.repository.name }}
      REPO_ORGANIZATION: ${{ github.repository_owner }}
      IMAGE_DESC: "My Customized Universal Blue Image - ${{ matrix.variant.image_desc }}"
      IMAGE_KEYWORDS: "bootc,ublue,universal-blue,${{ matrix.variant.name }}"
      IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
      DEFAULT_TAG: "latest"

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "MAIN_IMAGE_NAME=${REPO_NAME,,}" >> ${GITHUB_ENV}

      # dnf caches packages in podman's cache mounts (/var/tmp/buildah-cache-$UID).
      # Restore the newest cache for this variant; a new one is saved once per week.
      - name: DNF Package Cache Setup
        id: setup-cache
        run: |
          echo "key=buildah-dnf-${{ matrix.variant.name }}-$(date -u +%G-%V)" >> $GITHUB_OUTPUT

      - name: Restore DNF package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ steps.setup-cache.outputs.key }}
          restore-keys: |
            buildah-dnf-${{ matrix.variant.name }}-

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${{ matrix.variant.base_image }}" \
            "${{ matrix.variant.name }}"

      # https://github.com/actions/cache/issues/1533
      - name: Fix DNF package cache permissions
        run: |
          sudo chmod -R a+rwX /var/tmp/buildah-cache-* || true

      # PR caches can't be used by main, so only write from main
      - name: Write new DNF package cache
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ steps.setup-cache.outputs.key }}

      # This is optional, this provides smaller delta updates
      # Uses the new distro agnostic rechunker https://github.com/coreos/chunkah
      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # Classic rechunker, slower (~8-12 min per variant). Swap back if chunkah causes problems
      #- name: Rechunk with rpm-ostree
      #  id: rechunk
      #  run: |
      #    just ostree-rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 20
          shell: bash
          command: |
            set -euox pipefail
            for tag in ${ALIAS_TAGS}; do
              podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
              # Push twice to work around https://github.com/containers/podman/issues/27796
              # otherwise the digest can change and only the last tag would match the signature
              podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
            done

            digest=$(< /tmp/digestfile)

            echo "digest=${digest}" >> $GITHUB_OUTPUT

      # The bluefin variant is additionally published as the main image (without variant suffix)
      - name: Push Main Image To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.variant.name == 'bluefin'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 20
          shell: bash
          command: |
            set -euox pipefail
            for tag in ${ALIAS_TAGS}; do
              podman push ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${MAIN_IMAGE_NAME}:${tag}
              podman push ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${MAIN_IMAGE_NAME}:${tag}
            done

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

      - name: Sign main image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.variant.name == 'bluefin'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${MAIN_IMAGE_NAME}@${DIGEST}
